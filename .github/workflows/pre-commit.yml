name: Pre-commit checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  prek:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install dependencies
        run: uv sync --group dev

      # https://prek.j178.dev/integrations/#github-actions
      - name: Install and run prek on all files
        uses: j178/prek-action@v2
